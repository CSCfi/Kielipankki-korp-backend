id: reittidemo
title: Reitti A-siipeen
description: Kahdenkeskisen videoidun keskustelun ”Reitti A-siipeen” yleiskielistetty
  litteraatti. Keskustelussa selvitetään reittiä tiettyyn Helsingin yliopiston Metsätalossa
  sijaitsevaan huoneeseen. Vapaasti käytettäväksi tarkoitettu näyteaineisto.
