id: elfa
title: ELFA
description: ELFA – The Corpus of English as a Lingua Franca in Academic Settings
  (anonymised transcriptions), preliminary Korp version<br>The ELFA corpus contains
  1 million words of transcribed spoken academic ELF (approximately 131 hours of recorded
  speech). The recordings were made at the University of Tampere, the University of
  Helsinki, Tampere University of Technology, and Helsinki University of Technology.
