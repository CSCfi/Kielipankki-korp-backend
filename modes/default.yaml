      klk_fi_v2:
        title: Kansalliskirjaston lehtikokoelman (KLK) suomenkieliset lehdet, versio
          2
        description: 'Kansalliskirjaston sanoma- ja aikakauslehtikokoelman suomenkielinen
          osakorpus versio 2, Korp (klk-fi-v2-korp)<br/><br/>Tämä aineisto sisältää
          <a href="https://digi.kansalliskirjasto.fi/" target="_blank">Kansalliskirjaston
          lehtikokoelman</a> sanoma- ja aikakauslehtiä vuosilta 1771–2021. Aineistossa
          on yli neljä kertaa niin paljon saneita kuin <a href="http://urn.fi/urn:nbn:fi:lb-2016050302"
          target="_blank">aineiston aiemmassa versiossa</a>, joka myös on yhä käytettävissä
          Korpissa. Paljon uutta aineistoa on määrällisesti etenkin vuosilta 1911–1945,
          suhteellisesti myös vuosilta 1946–2000 ja kokonaan uutena vuosilta 2001–2021.<br/><br/><strong>Huomaa</strong>,
          että aineiston suuren koon vuoksi Korp-haut voivat olla hitaita, joten kannattaa
          ainakin ensin kokeilla hakuja pienehköllä osalla aineistoa.<br/><br/>Vuoteen
          1911 asti aineisto sisältää virkkeet alkuperäisessä järjestyksessä sekä
          kappalekontekstin, kun taas vuodesta 1912 alkaen virkkeet on sekoitettu
          kunkin tekstin (lehden sivun) sisällä eikä kappalekontekstia ole saatavilla.<br/><br/>Aineiston
          virkkeiden kieli on tunnistettu <a href="http://urn.fi/urn:nbn:fi:lb-2022092201"
          target="_blank">HeLI-OTS-kielentunnistimella</a>. Aineisto sisältää seuraavista
          lähdeaineistoista ne tekstit (lehden sivut), joilla vähintään yksi virke
          on tunnistettu suomeksi: <a href="http://urn.fi/urn:nbn:fi:lb-2016050302"
          target="_blank">Kansalliskirjaston lehtikokoelman suomenkielinen osakorpus
          (versio 1)</a>; <a href="http://urn.fi/urn:nbn:fi:lb-2016050301" target="_blank">Kansalliskirjaston
          lehtikokoelman ruotsinkielinen osakorpus (versio 1)</a>; sekä Kansalliskirjaston
          vuoden 2013 jälkeen tuottama aineisto, jota ei ole aiemmin ollut saatavilla
          Kielipankissa.<br/><br/>Huomaa, että toistaiseksi tästä aineistosta puuttuvat
          nimiannotaatiot, jollaiset ovat aiemmassa versiossa.<br/><br/>Aineistossa
          olevat linkit sivun kuviin ja PDF-tiedostoihin vievät <a href="https://digi.kansalliskirjasto.fi"
          target="_blank">Kansalliskirjaston digitaalisten aineistojen verkkosivuille</a>.
          Useimmille vuotta 1939 uudemmille lehdille sivun kuvien ja PDF-tiedostojen
          käyttö on sallittu vain tutkimustarkoituksiin ja edellyttää kirjautumista
          ja käyttölupalomakkeen täyttämistä Kansalliskirjaston palvelussa.'
