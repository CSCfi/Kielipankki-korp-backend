  spoken:
    title: Puheaineistoja
    description: Litteroitua puhuttua kieltä sisältäviä aineistoja
    subfolders:
      la_murre:
        title: Lauseopin arkiston murrekorpus
        description: Lauseopin arkiston murrekorpus edustaa kaikkia nykyisen Suomen
          alueella puhuttuja suomen kielen murteita sekä lisäksi niitä murteita, joita
          puhuttiin Neuvostoliitolle viime sotien yhteydessä luovutetuilla alueilla
          ennen alueiden luovuttamista. Puhujat ovat syntyneet vuosina 1860–1910 (suurin
          osa 1880-luvulla) ja haastattelut on tehty 1950–1970-luvuilla, jolloin puhujat
          ovat olleet keskimäärin 80-vuotiaita.<br/>Yhdestä pitäjänmurteesta on yleensä
          valittu käsiteltäväksi yksi noin tunnin laajuinen äänite. Murreaineisto
          on litteroitu sekä koodattu morfologisesti ja syntaktisesti. Tässä on saatavilla
          korpuksen versio, jossa litteraatit on karkeasti kohdistettu alkuperäisiin
          äänitteisiin.
