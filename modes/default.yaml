        description: Helsingin yliopiston suomenkielisen E-thesiksen Korp-versio<br/>Helsingin
          yliopiston digitaaliset väitöskirjat ja opinnäytteet<br/><br/>Aineisto kattaa
          ajanjakson 1.1.1999–30.9.2016
        subfolders:
          matheses:
            title: Pro gradu -tutkielmat
            description: 'Helsingin yliopiston suomenkielisen E-thesiksen Korp-versio:
              Pro gradu -tutkielmat'
          phdtheses:
            title: Väitöskirjat
            description: 'Helsingin yliopiston suomenkielisen E-thesiksen Korp-versio:
              Väitöskirjat'
  cmc:
    title: Tietokonevälitteistä viestintää
    description: Tietokonevälitteistä viestintää sisältäviä aineistoja (computer-mediated
      communication corpora)
    subfolders:
      suomi24:
        title: Suomi24 2016H2
        description: <a href='http://keskustelu.suomi24.fi' target='_blank'>Suomi24-keskustelupalvelun</a>
          keskustelut 1.1.2001–24.9.2016.<br/><br/><strong>Huomaa</strong>, että aineisto
          ei ole kattava mainitulta aikaväliltä. <strong>Käytä ensisijaisesti uudempaa
          ja selvästi kattavampaa <a href='http://urn.fi/urn:nbn:fi:lb-2019021101'
          target='_blank'>Suomi24 2017H2 -aineistoa</a></strong>, jollet tarvitse
          vertailukelpoisuutta tähän aineistoon perustuvan tutkimuksen kanssa.<br/><br/>Aineistossa
          näkyy kaikkien keskustelujen sisältö enintään kappaletasolla.<br/>Aineisto
          on jaettu useaan osakorpukseen suuren kokonsa vuoksi.<br/>Tutkijat voivat
          myös ladata käyttöönsä <a href='http://urn.fi/urn:nbn:fi:lb-201412171' target='_blank'
          title='Kuvailutiedot'>koko Suomi24-aineiston</a> Kielipankin <a href='http://urn.fi/urn:nbn:fi:lb-2015040801'
          target='_blank'>latauspalvelusta</a> (<a href='http://urn.fi/urn:nbn:fi:lb-20150304151'
          target='_blank'>lisenssi</a>).<br/><br/>(Tämä aineisto näkyi ennen Suomi24
          2017H2 -version julkaisemista Korpissa nimellä <i>Suomi24</i>.)
      suomi24_accruing:
        title: Suomi24 2001–2023 (julkaisuehdokas)
        description: Suomi24 virkkeet -korpus 2001–2023, Korp-versio<br/><br/><a href='http://keskustelu.suomi24.fi'
          target='_blank'>Suomi24-keskustelupalvelun</a> keskustelut vuosilta 2001–2023
          (1.1.2001–31.12.2023).<br/>Aineistossa näkyy kaikkien keskustelujen sisältö
          enintään kappaletasolla.<br/>Aineisto on jaettu osakorpuksiin vuosittain.<br/>Tutkijat
          voivat myös ladata käyttöönsä <a href='http://urn.fi/urn:nbn:fi:lb-2025032001'
          target='_blank' title='Kuvailutiedot'>koko Suomi24 2001–2023 -aineiston</a>
          Kielipankin <a href='http://urn.fi/urn:nbn:fi:lb-2025032002' target='_blank'>latauspalvelusta</a>
          (<a href='http://urn.fi/urn:nbn:fi:lb-2022020822' target='_blank'>lisenssi</a>).<br/><br/>Tämä
          kokoelma sisältää seuraavat aineistot:<br/><a href='http://urn.fi/urn:nbn:fi:lb-2020021803'
          target='_blank' title='Kuvailutiedot'><i>Suomi24 virkkeet -korpus 2001–2017,
          Korp-versio 1.3</i></a><br/><a href='http://urn.fi/urn:nbn:fi:lb-2021101521'
          target='_blank' title='Kuvailutiedot'><i>Suomi24 virkkeet -korpus 2018–2020,
          Korp-versio 1.1</i></a><br/><a href='http://urn.fi/urn:nbn:fi:lb-2024030601'
          target='_blank' title='Kuvailutiedot'><i>Suomi24 virkkeet -korpus 2021–2023,
          Korp-versio</i></a><br/><br/><i>2025-04-07:</i> Kokoelmaan on lisätty vuosien
          2021–2023 keskustelut (<a href='http://urn.fi/urn:nbn:fi:lb-2024030601'
          target='_blank' title='Kuvailutiedot'><i>Suomi24 virkkeet -korpus 2021–2023,
          Korp-versio</i></a>). Lisäksi koko aineistoon on merkitty <a href='http://urn.fi/urn:nbn:fi:lb-2024021401'
          target='_blank' title='kuvailutiedot'>FiNER 1.6 -nimientunnistimella</a>
          tunnistetut nimet ja <a href='http://urn.fi/urn:nbn:fi:lb-2024040301' target='_blank'
          title='kuvailutiedot'>HeLI-OTS 2.0 -kielentunnistimella</a> tunnistetut
          virkkeiden kielet. Vuosien 2001–2020 aineistoissa on myös poistettu ylimääräisiä
          välilyöntejä aihealueista, otsikoista ja kirjoittajien nimimerkeistä. Näiden
          lisäysten ja muutosten vuoksi vanhempien osien versionumeroita on kasvatettu.
          <a href='http://urn.fi/urn:nbn:fi:lb-2025040201' target='_blank'>Tarkempia
          tietoja muutoksista.</a><br/><br/><span rel="localize[$locKey]"><strong>Huomaa</strong>,
          että korpus on julkaisuehdokas, joten siihen voi vielä tulla muutoksia.</span>
  easytoread:
    title: Selkokieliaineistoja
    description: Selkokieliaineistoja<br/><br/><strong>Huomaa</strong>, että selkokieliset
      lehdet ovat edelleen osa aineistoa <i>1990- ja 2000-luvun suomalaisia aikakaus-
      ja sanomalehtiä</i>. Niistä tulevat hakutulokset näkyvät kuitenkin vain yhteen
      kertaan, vaikka ne olisi valittu sekä osana selkokieliaineistoja että osana
      muita lehtiä.
    subfolders:
      lehdet:
        title: Selkokielisiä lehtiä
        description: ''
      ylenews_fi_selko:
        title: Ylen suomenkielisen uutisarkiston selkouutiset
        description: 'Ylen suomenkielisen uutisarkiston selkouutiset<br/><br/>Kansiossa
          on kaksi korpusta, jotka sisältävät samat virkkeet mutta joilla on erilaiset
          käyttöehdot ja ominaisuudet: kaikille avoimen korpuksen virkkeet on sekoitettu
          kunkin tekstin sisällä eikä se tue laajennettua kontekstia, kun taas tutkijoiden
          käytettävissä olevan korpuksen virkkeet ovat alkuperäisessä järjestyksessä
          ja se tukee laajennettua kontekstia.<br/><br/>Huomaa, että selkouutiset
          ovat myös osana laajempaa Ylen suomenkielinen uutisarkisto -aineistoa.'
