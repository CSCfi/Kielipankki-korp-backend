      ylenews_fi:
        title: Ylen suomenkielinen uutisarkisto
        description: 'Ylen suomenkielinen uutisarkisto<br/><br/>Kansiossa on kaksi
          korpusta, jotka sisältävät samat virkkeet mutta joilla on erilaiset käyttöehdot
          ja ominaisuudet: kaikille avoimen korpuksen virkkeet on sekoitettu kunkin
          tekstin sisällä eikä se tue laajennettua kontekstia, kun taas tutkijoiden
          käytettävissä olevan korpuksen virkkeet ovat alkuperäisessä järjestyksessä
          ja se tukee laajennettua kontekstia.<br/><br/>Huomaa, että korpus sisältää
          selkouutiset, jotka ovat Korpissa myös erillisenä aineistonaan.'
        subfolders:
          a:
            title: Ylen suomenkielinen uutisarkisto 2011–2021 (tutkijoille) [ACA]
            description: 'Ylen suomenkielinen uutisarkisto 2011–2021, Korp<br/>Tutkijoiden
              käytettävissä oleva versio: virkkeet alkuperäisessä järjestyksessä ja
              tuki laajennetulle kontekstille.<br/><br/>Aineisto on jaettu osakorpuksiin
              vuosittain, ja tekstit kunkin vuoden sisällä on järjestetty muokkausajankohdan
              mukaan.<br/><br/>Tämä kokoelma sisältää aineistot <a href=''http://urn.fi/urn:nbn:fi:lb-2019121003''
              target=''_blank'' title=''Kuvailutiedot''><i>Ylen suomenkielinen uutisarkisto
              2011-2018, Korp</i></a> ja <a href=''http://urn.fi/urn:nbn:fi:lb-2022031701''
              target=''_blank'' title=''Kuvailutiedot''><i>Ylen suomenkielinen uutisarkisto
              2019-2021, Korp</i></a>.<br/><br/>Huomaa, että korpus sisältää selkouutiset,
              jotka ovat Korpissa myös erillisenä aineistonaan.'
          s:
            title: Ylen suomenkielinen uutisarkisto 2011–2021 (kaikille)
            description: 'Ylen suomenkielinen uutisarkisto 2011–2021, sekoitettu,
              Korp<br/>Kaikille avoin versio: virkkeet sekoitettuina kunkin tekstin
              sisällä ja ilman laajennetun kontekstin tukea.<br/><br/>Aineisto on
              jaettu osakorpuksiin vuosittain, ja tekstit kunkin vuoden sisällä on
              järjestetty muokkausajankohdan mukaan.<br/><br/>Tämä kokoelma sisältää
              aineistot <a href=''http://urn.fi/urn:nbn:fi:lb-2019121004'' target=''_blank''
              title=''Kuvailutiedot''><i>Ylen suomenkielinen uutisarkisto 2011-2018,
              sekoitettu, Korp</i></a> ja <a href=''http://urn.fi/urn:nbn:fi:lb-2022032201''
              target=''_blank'' title=''Kuvailutiedot''><i>Ylen suomenkielinen uutisarkisto
              2019-2021, sekoitettu, Korp</i></a>.<br/><br/>Huomaa, että korpus sisältää
              selkouutiset, jotka ovat Korpissa myös erillisenä aineistonaan.'
  other:
    title: Muita aineistoja
    description: Muita aineistoja
    subfolders:
      kotus_ns_presidentti:
        title: Tasavallan presidenttien uudenvuodenpuheet
        description: Tasavallan presidenttien uudenvuodenpuheiden kokoelmassa on kaikki
          tasavallan presidenttien pitämät uudenvuodenpuheet vuosilta 1935–2007. Muutaman
          kerran puheen on pitänyt joku muu kuin presidentti. Nämäkin puheet sisältyvät
          aineistoon.<br/>Kokoelma on järjestetty presidenteittäin ja vuosittain.
          Kokoelma koostuu lehtileikkeistä, konekirjoitusliuskoista, kirjojen sivuista,
          lehdistötiedotteista ja verkkoteksteistä. Aineistoa on hankittu arkistoista,
          kirjoista ja Internetistä.
