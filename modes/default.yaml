    subfolders:
      semfinlex:
        title: Semfinlex
        description: 'Valikoima Eduskunnan alkuperäisiä säädöksiä (1917–2018 sekä
          muutamia varhaisempia), KKO:n päätöksiä (1980–2018) ja KHO:n päätöksiä (1987–2018).<br/><br/>2019-09-02:
          Huomaa, että aineiston <strong>dependenssijäsennykset ja -relaatiot poikkeavat
          merkittävästi</strong> aiemmin samalla jäsentimellä jäsennettyjen aineistojen
          jäsennyksistä. Selvitämme asiaa. <strong>Jos tarvitset dependenssijäsennystietoja,
          käytä toistaiseksi muita aineistoja.</strong>'
  literary:
    title: Kirjallisuusaineistoja
    description: Kirjallisuusaineistoja
    subfolders:
      ceal:
        title: CEAL
        description: Englantilaisen ja amerikkalaisen kirjallisuuden klassikoita suomeksi<br/>Classics
          of English and American Literature in Finnish<br/><br/><strong>Huomaa</strong>,
          että korpukset CEAL-o ja CEAL-s sisältävät samat tekstit, mutta CEAL-s:ssä
          kappaleet on sekoitettu kunkin teoksen sisällä, kun taas CEAL-o:ssa kappaleet
          ovat alkuperäisessä järjestyksessä. Hakuja varten kannattaa valita vain
          toinen korpus. CEAL-o vaatii aina henkilökohtaisen käyttöluvan.
      ftc_literary:
        title: 'Suomen kielen tekstikokoelma (SKTP/FTC): kirjallisuus [RES]'
        description: 'Suomen kielen tekstikokoelman kirjallisuus: Lemmie-palvelussa
          olleet osakorpukset<br/><br/><strong>Huomaa</strong>, että Suomen kielen
          tekstikokoelman lehdet ovat korpusvalikon kansiossa <i>Lehti- ja uutisaineistoja</i>.'
      kaannossuomi:
        title: Käännössuomen korpus [RES]
        description: 'Käännössuomen korpus on koostettu vuonna 1999 nykyisessä Itä-Suomen
          yliopistossa (silloisessa Joensuun yliopistossa sen kansainvälisen viestinnän
          laitoksella) Suomen Akatemian professori Anna Maurasen johtamassa tutkimushankkeessa
          Käännössuomi ja kääntämisen universaalit.<br/><br/>Korpus sisältää kaksi
          osaa: aluperin suomeksi kirjoitettua kieltä (alkusuomi) ja eri kielistä
          käännettyä kieltä (käännössuomi). Seuraavat tekstilajit ovat edustettuina
          aineistoissa: akateemiset tekstit, kaunokirjallisuus, lastenkirjallisuus,
          biografia, populaarikirjallisuus, viihdekirjallisuus, dekkarikirjallisuus
          ja tietokirjallisuus. Alkusuomen aineiston laajuus on yhteensä 5 465 293
          sanaa ja käännössuomen aineiston 7 135 969 sanaa.'
      skk:
        title: Suomalaisen kirjallisuuden klassikoita
        description: ''
