      ylenews_sv:
        title: Yle svenska webbartiklar
        description: 'Yle svenska webbartiklar<br/><br/>Mappen innehåller två korpusar
          med samma meningar men med olika tillgänglighet och egenskaper: den ena
          korpusen är öppen för alla och har meningarna i en blandad ordning inom
          varje text och utan utökad kontextvisning, medan den andra korpusen är tillgänglig
          för forskare och har meningarna i den ursprungliga ordningen och stöd för
          utökad kontextvisning.'
        subfolders:
          a:
            title: Yle svenska webbartiklar 2012–2018 (för forskare) [ACA]
            description: 'Yle svenska webbartiklar 2012–2018, Korp<br/>Variant tillgänglig
              för forskare: meningarna i den ursprungliga ordningen och stöd för utökad
              kontextvisning<br/><br/>Korpusen är indelad i delkorpusar enligt år,
              och artiklarna är ordnade enligt redigeringsdatumet.'
          s:
            title: Yle svenska webbartiklar 2012–2018 (för alla)
            description: 'Yle svenska webbartiklar 2012–2018, blandad, Korp<br/>Variant
              öppen för alla: meningarna i en blandad ordning inom varje text och
              ingen utökad kontextvisning<br/><br/>Korpusen är indelad i delkorpusar
              enligt år, och artiklarna är ordnade enligt redigeringsdatumet.'
