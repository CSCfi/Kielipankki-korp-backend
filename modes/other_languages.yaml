folders:
  cuneiform:
    title: Cuneiform / Nuolenpääkirjoitus
    description: Transliterated cuneiform texts<br/>Translitteroituja nuolenpääkirjoitustekstejä
    subfolders:
      achemenet:
        title: Achemenet
        description: Achemenet Babylonian texts – Kielipankki version 2020-12, Korp<br/><br/><a
          href="http://www.achemenet.com/" target="_blank">The Achemenet project</a>
          provides transliterations and translations of documents written in the Achaemenid
          Persian Empire (550–330 BCE).<br/>The Korp version of Achemenet contains
          the Babylonian cuneiform texts available in Achemenet in December 2020.<br/>The
          texts have been automatically lemmatized at the <a href="https://www.helsinki.fi/en/researchgroups/ancient-near-eastern-empires">Centre
          of Excellence in Ancient Near Eastern Empires</a> (University of Helsinki),
          funded by the Research Council of Finland.<br/><br/>More information about
          the corpus is available at <a href="https://doi.org/10.5281/zenodo.14223709"
          target="_blank">https://doi.org/10.5281/zenodo.14223709</a>.
      balt:
        title: BALT
        description: 'BALT: Babylonian Administrative and Legal Texts – Kielipankki
          version 2025-02, Korp<br/><br/>The corpus contains Babylonian cuneiform
          texts from the Neo-Babylonian, Persian, and Hellenistic periods (c. 626–93
          BCE).<br/>More than half of the transliterated texts are legacy data of
          the late János Everling. The other texts have been transliterated and translated
          by Johannes Hackl, Bojana Janković, Michael Jursa, Yuval Levavi, Martina
          Schmidl and Caroline Waerzeggers.<br/>The texts have been automatically
          lemmatized at the <a href="https://www.helsinki.fi/en/researchgroups/ancient-near-eastern-empires">Centre
          of Excellence in Ancient Near Eastern Empires</a> (University of Helsinki),
          funded by the Research Council of Finland.<br/><br/>More information about
          the corpus is available at <a href="https://doi.org/10.5281/zenodo.14186072"
          target="_blank">https://doi.org/10.5281/zenodo.14186072</a>.'
      oracc:
        title: Oracc 2019
        description: Oracc – Open Richly Annotated Cuneiform Corpus, Korp Version,
          May 2019
      oracc2021:
        title: Oracc 2021
        description: Oracc – Open Richly Annotated Cuneiform Corpus, Korp Version,
          June 2021<br/><br/>Note that the subcorpora CAMS, CTIJ, DCCLT and HBTIN
          contain less data than their counterparts in <a href="http://urn.fi/urn:nbn:fi:lb-2019060601"
          target="_blank">Oracc, Korp version, May 2019</a>. This version is based
          on the JSON data that was available in <a href="http://oracc.museum.upenn.edu/"
          target="_blank">Oracc</a> in June 2021.<br/>A list of Oracc texts included
          in this Korp version is <a href="http://urn.fi/urn:nbn:fi:lb-2024092401"
          target="_blank">here</a> (the CDLI number and lemmatization status of each
          text in Oracc).
